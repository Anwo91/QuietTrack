name: quiettrack
description: "QuietTrack - Windows Activity Tracker"
publish_to: 'none'
version: 1.0.1+2
repository: https://github.com/Anwo91/QuietTrack
homepage: https://github.com/Anwo91/QuietTrack
license: MIT

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.70.2
  intl: ^0.20.2
  win32: ^5.10.0
  tray_manager: ^0.2.3
  window_manager: ^0.4.3
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  shimmer: ^3.0.0
  ffi: ^2.1.4
  http: ^1.3.0
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/quiettrack.png
